name: prsplit close original #20

on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write
  contents: write

jobs:
  close-original-pr:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.number == 52 }}
    runs-on: ubuntu-latest
    steps:
      - name: Close original PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 20,
              state: 'closed',
            });

            const originalBaseBranch = "main";
            const cleanupWorkflowFilenames = ["chain-50-to-51.yml","chain-51-to-52.yml","close-original-20.yml"];
            console.log(
              `Cleaning up prsplit workflows for base "${originalBaseBranch}"...`
            );

            for (const workflowFilename of cleanupWorkflowFilenames) {
              const workflowPath = `.github/workflows/${workflowFilename}`;

              try {
                const { data: workflowFile } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: workflowPath,
                });

                if (Array.isArray(workflowFile) || !('sha' in workflowFile)) {
                  continue;
                }

                await github.rest.repos.deleteFile({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: workflowPath,
                  message: `chore: remove prsplit workflow ${workflowFilename}`,
                  sha: workflowFile.sha,
                });
              } catch (error) {
                if (error && typeof error === 'object' && 'status' in error && error.status === 404) {
                  continue;
                }
                throw error;
              }
            }