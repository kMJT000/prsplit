# Auto-generated by prsplit - Auto-close original PR
# If final split PR #14 is merged, close original PR #10
name: "prsplit: close original PR #10"

on:
  pull_request:
    types: [closed]

jobs:
  close-original-pr:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number == 14
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close original PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 10,
              state: 'closed',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: '✅ All split PRs were merged, so this original PR was closed automatically.',
            });

            console.log('Closed original PR #10');
