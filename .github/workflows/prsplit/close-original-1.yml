# Auto-generated by prsplit - 元PRの自動close
# 最終分割PR #6 がマージされたら元PR #1 をcloseする
name: "prsplit: close original PR #1"

on:
  pull_request:
    types: [closed]

jobs:
  close-original-pr:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number == 6
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close original PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 1,
              state: 'closed',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '✅ すべての分割PRがマージされたため、このPRを自動closeしました。',
            });

            console.log('元PR #1 をcloseしました');
