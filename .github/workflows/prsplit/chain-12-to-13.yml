# Auto-generated by prsplit - Chain PR merge watcher
# If PR #12 is merged, mark PR #13 as ready for review
name: "prsplit: #12 → #13"

on:
  pull_request:
    types: [closed]

jobs:
  promote-next-pr:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.number == 12
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark next PR as ready for review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 13,
            });

            if (pr.draft) {
              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  markPullRequestReadyForReview(input: { pullRequestId: $pullRequestId }) {
                    pullRequest { isDraft }
                  }
                }
              `, { pullRequestId: pr.node_id });

              console.log('Marked PR #13 as ready for review');
            } else {
              console.log('PR #13 is already ready for review');
            }
